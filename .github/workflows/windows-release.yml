name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build application
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path dist\ConcentradoVentas\* -DestinationPath dist\ConcentradoVentas-portable.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ConcentradoVentas-windows
          path: |
            dist/installer/*.exe
            dist/ConcentradoVentas-portable.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          gh release create "$env:GITHUB_REF_NAME" `
            $installer `
            dist\ConcentradoVentas-portable.zip `
            --generate-notes `
            --title "Concentrado de Ventas $env:GITHUB_REF_NAME"
