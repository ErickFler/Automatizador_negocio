[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-concentrado-ventas"
dynamic = ["version"]
description = "Aplicacion local para concentrar reportes de ventas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5,<1.0",
    "jinja2>=3.1,<4.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "starlette>=1.3.1,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=9.0.3,<10.0",
]
packaging = [
    "pyinstaller==6.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}
