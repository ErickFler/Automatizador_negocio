<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Concentrado de Ventas{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">CV</span>
        <span>Concentrado de Ventas</span>
      </a>
      <nav aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a href="/imports/new">Cargar ventas</a>
        <a href="/products">Productos</a>
        <a href="/reports">Reportes</a>
        <a href="/imports">Historial</a>
      </nav>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <footer>Aplicación local · Los datos permanecen en este equipo</footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
